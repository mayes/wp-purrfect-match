<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 446" width="1200" height="446" role="img" aria-label="Preview of the Purrfect Match adoptable-pets grid">
  <defs>
    <linearGradient id="p0" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e3e7ee"/><stop offset="1" stop-color="#c8cdd8"/></linearGradient>
    <linearGradient id="p1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ead9e2"/><stop offset="1" stop-color="#cdb9c6"/></linearGradient>
    <linearGradient id="p2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#dde6e6"/><stop offset="1" stop-color="#c2cfce"/></linearGradient>
    <g id="paw" fill="#ffffff" opacity="0.85">
      <ellipse cx="0" cy="14" rx="22" ry="16"/>
      <circle cx="-20" cy="-8" r="8"/>
      <circle cx="-4" cy="-16" r="8"/>
      <circle cx="14" cy="-14" r="8"/>
      <circle cx="28" cy="-2" r="8"/>
    </g>
    <style> text { font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; } </style>
  </defs>

  <rect width="1200" height="446" rx="24" fill="#f7f8fb"/>

  <!-- Card 1: Luna -->
  <g transform="translate(40,40)">
    <rect x="0" y="6" width="360" height="366" rx="18" fill="#000000" opacity="0.05"/>
    <rect x="0" y="0" width="360" height="366" rx="18" fill="#ffffff" stroke="#eceef2"/>
    <path d="M0,18 a18,18 0 0 1 18,-18 h324 a18,18 0 0 1 18,18 v172 h-360 z" fill="url(#p0)"/>
    <use href="#paw" transform="translate(180,92) scale(1.5)"/>
    <rect x="16" y="16" width="118" height="26" rx="13" fill="#111111" opacity="0.78"/>
    <text x="30" y="33" font-size="12" font-weight="700" fill="#ffffff">Young • Small</text>
    <text x="18" y="228" font-size="23" font-weight="800" fill="#16181d">Luna</text>
    <text x="18" y="253" font-size="14" fill="#8a8f98">Domestic Short Hair</text>
    <text x="18" y="274" font-size="13" fill="#aab0b8">CJ Paws</text>
    <rect x="16" y="300" width="158" height="42" rx="21" fill="#e93396"/>
    <text x="95" y="326" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">Apply to adopt</text>
    <rect x="186" y="300" width="158" height="42" rx="21" fill="#ffffff" stroke="#e5e7eb"/>
    <text x="265" y="326" font-size="14" font-weight="700" fill="#16181d" text-anchor="middle">View details</text>
  </g>

