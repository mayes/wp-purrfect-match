<svg xmlns="http://www.w3.org/2000/svg" width="400" height="300" viewBox="0 0 400 300">
  <rect fill="#f0f0f1" width="400" height="300"/>
  <g transform="translate(160, 90)" fill="#c0c0c0">
    <!-- Cat ears -->
    <polygon points="10,60 25,10 40,60"/>
    <polygon points="45,60 60,10 75,60"/>
    <!-- Cat head -->
    <ellipse cx="42" cy="80" rx="38" ry="30"/>
    <!-- Cat eyes -->
    <ellipse cx="28" cy="75" rx="6" ry="7" fill="#a0a0a0"/>
    <ellipse cx="56" cy="75" rx="6" ry="7" fill="#a0a0a0"/>
    <!-- Cat nose -->
    <polygon points="39,85 42,90 45,85" fill="#a0a0a0"/>
    <!-- Cat mouth -->
    <path d="M36,92 Q42,98 48,92" stroke="#a0a0a0" fill="none" stroke-width="1.5"/>
  </g>
  <text x="200" y="240" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" fill="#a0a0a0">No Photo Available</text>
</svg>
